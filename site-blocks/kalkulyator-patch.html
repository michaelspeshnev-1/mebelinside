<!-- Патч калькулятора (08.10.2026, карточка zalivka/20): правило замера, срок 45–60, кликабельное окно контактов.
     Ставится в конец описания страниц с калькулятором (`#miCalcFrame` — iframe, пишется скриптом head_scripts.post.tpl).
     Откат: удалить этот блок со страницы. Сам шаблон head_scripts.post.tpl НЕ менялся. -->
<script>
(function(){
  var MAP=[
    ['Заказать бесплатный замер','Получить точный расчёт'],
    ['30–60 дней','45–60 дней · AGT — от 30 дней'],
    ['Замер и дизайн-проект — бесплатно','3D-проект — бесплатно. Замер — бесплатно после просчёта в шоуруме; без просчёта 1500 ₽ Пятигорск, 2000 ₽ КМВ — вычитаем из заказа'],
    ['после бесплатного замера','после замера']
  ];
  function modal(){
    var d=document,old=d.getElementById('mi-cb');
    if(old){old.style.display='flex';return;}
    var max='';var m=d.querySelector('a[href*="max.ru"]');if(m)max=m.href;
    var B='display:block;margin:8px 0;padding:12px 14px;border-radius:10px;text-decoration:none;font:600 16px/1.2 sans-serif;text-align:center;';
    var h='<div style="background:#fff;color:#222;max-width:360px;width:92%;border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.4)">'
     +'<div style="font:700 18px sans-serif;margin-bottom:6px">Свяжитесь с нами</div>'
     +'<div style="font:14px/1.4 sans-serif;color:#555;margin-bottom:10px">Пришлите размеры или план — посчитаем точно и сделаем 3D-проект бесплатно.</div>'
     +'<a href="tel:+79289516342" style="'+B+'background:#1f9d55;color:#fff">Позвонить: +7 928 951-63-42</a>'
     +'<a href="tel:+79034440781" style="'+B+'background:#1f9d55;color:#fff">Позвонить: +7 903 444-07-81</a>'
     +'<a target="_blank" rel="noopener" href="https://api.whatsapp.com/send?phone=79289516342&text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!%20%D0%A5%D0%BE%D1%87%D1%83%20%D1%82%D0%BE%D1%87%D0%BD%D1%8B%D0%B9%20%D1%80%D0%B0%D1%81%D1%87%D1%91%D1%82" style="'+B+'background:#25d366;color:#fff">WhatsApp</a>'
     +'<a target="_blank" rel="noopener" href="https://t.me/mebel_inside" style="'+B+'background:#2aabee;color:#fff">Telegram</a>'
     +(max?'<a target="_blank" rel="noopener" href="'+max+'" style="'+B+'background:#6b4eff;color:#fff">MAX</a>':'')
     +'<a href="#" id="mi-cb-x" style="'+B+'color:#555;background:#eee">Закрыть</a></div>';
    var w=d.createElement('div');w.id='mi-cb';
    w.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:99999';
    w.innerHTML=h;
    w.addEventListener('click',function(e){if(e.target===w||e.target.id==='mi-cb-x'){e.preventDefault();w.style.display='none';}});
    d.body.appendChild(w);
  }
  function patch(){
    var f=document.getElementById('miCalcFrame');
    if(!f||!f.contentWindow)return false;
    var doc;try{doc=f.contentWindow.document;}catch(e){return false;}
    if(!doc||!doc.body||!doc.querySelector('.cta'))return false;
    if(doc.body.getAttribute('data-mi-patched'))return true;
    var w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,null,false),n,list=[];
    while((n=w.nextNode()))list.push(n);
    list.forEach(function(t){
      var v=t.nodeValue;if(!v)return;
      MAP.forEach(function(p){if(v.indexOf(p[0])>-1)v=v.split(p[0]).join(p[1]);});
      if(v!==t.nodeValue)t.nodeValue=v;
    });
    f.contentWindow.callback=modal;
    doc.body.setAttribute('data-mi-patched','1');
    return true;
  }
  var tries=0,iv=setInterval(function(){tries++;if(patch()||tries>60)clearInterval(iv);},500);
})();
</script>
